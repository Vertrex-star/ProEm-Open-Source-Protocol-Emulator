# =============================================================================
# Project: ProEm - Open Source Protocol Emulator
# File: .github/workflows/gds.yaml
# Type: Workflow: Tiny Tapeout GDS build, precheck, gate-level test and layout viewer
# Author: Paul Vincent Bezzina
# Description:
# =============================================================================

name: gds

# Manual only: the full build takes about two hours of Actions time, so it no longer runs on every push.
# Run it from the Actions tab (gds, Run workflow) before submitting: Tiny Tapeout needs a passing run on
# the commit that is submitted.
on:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
