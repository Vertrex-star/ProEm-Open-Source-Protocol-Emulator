name: lean

on:
  push:
    paths: ['lean/**']
  pull_request:
    paths: ['lean/**']
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: false
